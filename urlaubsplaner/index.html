<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="" data-i18n-content="urlaubsplaner.meta">
  <title data-i18n-title="urlaubsplaner.title"></title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="header header-small">
    <div class="container">
      <a class="back-link" href="../index.html" data-i18n="nav.apps"></a>
      <h1 data-i18n="urlaubsplaner.heading"></h1>
      <p class="subtitle" data-i18n="urlaubsplaner.subtitle"></p>
    </div>
  </header>

  <main class="container">
    <article class="app-detail">
      <img class="app-detail-icon" src="icon.png" alt="Urlaubsplaner">
      <div class="app-detail-body">
        <p class="app-lead" data-i18n="urlaubsplaner.intro"></p>
        <div class="app-actions">
          <a class="btn" href="https://play.google.com/store/apps/details?id=de.smcode.vacationplaner" target="_blank" rel="noopener noreferrer" data-i18n="btn.play"></a>
        </div>
      </div>
    </article>

    <section class="app-description">
      <h2 data-i18n="urlaubsplaner.features.title"></h2>

      <div class="app-feature">
        <h3 data-i18n="urlaubsplaner.f.balance.title"></h3>
        <p data-i18n="urlaubsplaner.f.balance.text"></p>
      </div>

      <div class="app-feature">
        <h3 data-i18n="urlaubsplaner.f.marking.title"></h3>
        <ul class="feature-list">
          <li data-i18n="urlaubsplaner.f.marking.tap"></li>
          <li data-i18n="urlaubsplaner.f.marking.long"></li>
          <li data-i18n="urlaubsplaner.f.marking.half"></li>
        </ul>
      </div>

      <div class="app-feature">
        <h3 data-i18n="urlaubsplaner.f.holidays.title"></h3>
        <p data-i18n="urlaubsplaner.f.holidays.text"></p>
      </div>

      <div class="app-feature">
        <h3 data-i18n="urlaubsplaner.f.views.title"></h3>
        <p data-i18n="urlaubsplaner.f.views.text"></p>
      </div>

      <div class="app-feature">
        <h3 data-i18n="urlaubsplaner.f.export.title"></h3>
        <p data-i18n="urlaubsplaner.f.export.text"></p>
      </div>

      <div class="app-feature">
        <h3 data-i18n="urlaubsplaner.f.widget.title"></h3>
        <p data-i18n="urlaubsplaner.f.widget.text"></p>
      </div>

      <div class="app-feature">
        <h3 data-i18n="urlaubsplaner.f.colors.title"></h3>
        <p data-i18n="urlaubsplaner.f.colors.text"></p>
      </div>

      <div class="app-feature">
        <h3 data-i18n="urlaubsplaner.f.backup.title"></h3>
        <p data-i18n="urlaubsplaner.f.backup.text"></p>
      </div>

      <h2 data-i18n="urlaubsplaner.privacy.title"></h2>
      <ul class="feature-list app-privacy-list">
        <li data-i18n="urlaubsplaner.privacy.l1"></li>
        <li data-i18n="urlaubsplaner.privacy.l2"></li>
        <li data-i18n="urlaubsplaner.privacy.l3"></li>
      </ul>
    </section>

    <section class="carousel" data-i18n-placeholder="urlaubsplaner.carousel">
      <h2 class="carousel-title" data-i18n="urlaubsplaner.screenshots"></h2>
      <div class="carousel-frame">
        <button class="carousel-btn carousel-prev" type="button" data-i18n-placeholder="urlaubsplaner.prev">&lsaquo;</button>
        <div class="carousel-viewport">
          <div class="carousel-track">
            <figure class="carousel-slide">
              <img src="assets/screenshot/01.png" alt="" data-i18n-placeholder="urlaubsplaner.shot" data-i18n-n="1" loading="lazy">
            </figure>
            <figure class="carousel-slide">
              <img src="assets/screenshot/02.png" alt="" data-i18n-placeholder="urlaubsplaner.shot" data-i18n-n="2" loading="lazy">
            </figure>
            <figure class="carousel-slide">
              <img src="assets/screenshot/03.png" alt="" data-i18n-placeholder="urlaubsplaner.shot" data-i18n-n="3" loading="lazy">
            </figure>
            <figure class="carousel-slide">
              <img src="assets/screenshot/04.png" alt="" data-i18n-placeholder="urlaubsplaner.shot" data-i18n-n="4" loading="lazy">
            </figure>
          </div>
        </div>
        <button class="carousel-btn carousel-next" type="button" data-i18n-placeholder="urlaubsplaner.next">&rsaquo;</button>
      </div>
      <div class="carousel-dots" role="tablist" data-i18n-placeholder="urlaubsplaner.dots">
        <button class="carousel-dot active" type="button" role="tab" aria-selected="true" data-i18n-placeholder="urlaubsplaner.shot" data-i18n-n="1"></button>
        <button class="carousel-dot" type="button" role="tab" aria-selected="false" data-i18n-placeholder="urlaubsplaner.shot" data-i18n-n="2"></button>
        <button class="carousel-dot" type="button" role="tab" aria-selected="false" data-i18n-placeholder="urlaubsplaner.shot" data-i18n-n="3"></button>
        <button class="carousel-dot" type="button" role="tab" aria-selected="false" data-i18n-placeholder="urlaubsplaner.shot" data-i18n-n="4"></button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-top">
        <p>&copy; 2026 Smolik Maksim</p>
        <nav>
          <a href="privacy-policy.html" data-i18n="nav.privacy"></a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="../i18n.js" data-parts="shared urlaubsplaner"></script>
  <script src="carousel.js"></script>
</body>
</html>
